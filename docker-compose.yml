version: '3.8'

services:
  agrify-backend:
    build: .
    container_name: agrify_backend_prod
    ports:
      - "5000:5000"
    env_file:
      - backend/.env
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
